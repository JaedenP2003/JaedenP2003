name: Deploy Planner

on:
  push:
    branches: [main]
    paths:
      - 'planner/**'
      - '.github/workflows/deploy-planner.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: planner/package-lock.json

      - name: Install dependencies
        working-directory: planner
        run: npm ci

      - name: Build
        working-directory: planner
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: planner/dist
          destination_dir: planner
          keep_files: true
